<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Chọn bài</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Chọn bài</h1>
  <div id="status" class="status" aria-live="polite">Đang kết nối…</div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-view="search" role="tab">Tìm bài</button>
  <button class="tab" data-view="queue" role="tab">Hàng chờ <span id="queue-count"></span></button>
</nav>

<main>
  <section id="view-search" class="view active">
    <form id="search-form" autocomplete="off">
      <input id="q" type="search" placeholder="Tên bài hoặc ca sĩ…"
             enterkeyhint="search" autocomplete="off">
      <button type="submit">Tìm</button>
    </form>
    <p id="search-note" class="note" hidden></p>
    <ul id="results" class="list"></ul>
  </section>

  <section id="view-queue" class="view">
    <div id="now-playing" class="now" hidden></div>
    <ul id="queue" class="list"></ul>
    <p id="queue-empty" class="note">Chưa có bài nào trong hàng chờ.</p>
  </section>
</main>

<dialog id="singer-dialog">
  <form method="dialog">
    <h2 id="singer-title">Đặt bài</h2>
    <label for="singer">Tên người hát</label>
    <input id="singer" type="text" maxlength="24" placeholder="Không bắt buộc">
    <menu>
      <button value="cancel">Huỷ</button>
      <button id="singer-ok" value="ok" class="primary">Đặt bài</button>
    </menu>
  </form>
</dialog>

<script src="app.js" type="module"></script>
</body>
</html>
