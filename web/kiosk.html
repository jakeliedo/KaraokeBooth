<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>KaraokeBooth — Kiosk</title>
<link rel="stylesheet" href="kiosk.css">
</head>
<body>

<div id="app">

  <!-- ── CỘT TRÁI: tìm bài ─────────────────────────────────── -->
  <section class="search-col">
    <div class="search-header">
      <h1>Chọn bài</h1>
      <span id="status" class="chip">Đang kết nối…</span>
    </div>

    <form id="search-form" autocomplete="off">
      <input id="q" type="search" placeholder="Tên bài hoặc ca sĩ…"
             autocomplete="off" enterkeyhint="search">
      <button type="submit" class="btn-search">Tìm</button>
    </form>

    <p id="search-note" class="hint" hidden></p>
    <ul id="results" class="song-list"></ul>
  </section>

  <!-- ── CỘT PHẢI: đang phát + hàng chờ ───────────────────── -->
  <aside class="sidebar">

    <!-- Đang phát + điều khiển: trái = điều khiển/tiến trình, phải = preview,
         dưới cùng = tên bài full-width (để tên dài không bị bóp hẹp) -->
    <div class="player-card" id="now-playing">
      <div class="np-row">
        <div class="np-left">
          <div class="controls">
            <button class="ctrl-btn" id="btn-replay" title="Phát lại từ đầu">⟳</button>
            <button class="ctrl-btn primary" id="btn-toggle" title="Phát / Dừng">▶</button>
            <button class="ctrl-btn" id="btn-next" title="Bài tiếp">⏭</button>

            <div class="divider-v"></div>

            <div class="knob-group">
              <span class="knob-label">Âm lượng</span>
              <div class="knob-row">
                <button class="ctrl-sm" id="vol-dn">−</button>
                <span class="knob-val" id="vol-val">100</span>
                <button class="ctrl-sm" id="vol-up">+</button>
              </div>
            </div>

            <div class="knob-group">
              <span class="knob-label">Tông</span>
              <div class="knob-row">
                <button class="ctrl-sm" id="pitch-dn">−</button>
                <span class="knob-val" id="pitch-val">0</span>
                <button class="ctrl-sm" id="pitch-up">+</button>
              </div>
            </div>
          </div>

          <div class="np-progress">
            <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-time">
              <span id="np-pos">0:00</span>
              <span id="np-dur">0:00</span>
            </div>
          </div>
        </div>

        <div class="np-preview-wrap" id="np-art">
          <img id="np-preview" src="" alt="" onerror="this.style.display='none'" onload="this.style.display=''">
          <svg id="np-placeholder" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="180" fill="#111"/>
            <circle cx="160" cy="90" r="38" stroke="#333" stroke-width="2"/>
            <circle cx="160" cy="90" r="14" fill="#222"/>
            <path d="M154 81l18 9-18 9V81z" fill="#555"/>
          </svg>
        </div>
      </div>

      <div class="np-titlebar">
        <span class="np-title" id="np-title">Chưa có bài</span>
        <span class="np-singer" id="np-singer"></span>
      </div>
    </div>

    <!-- Hàng chờ -->
    <div class="queue-section">
      <div class="queue-header">
        <span>Hàng chờ</span>
        <span class="chip" id="queue-count"></span>
      </div>
      <ul id="queue-list" class="queue-list"></ul>
      <p id="queue-empty" class="hint">Chưa có bài nào trong hàng chờ.</p>
    </div>

  </aside>
</div>

<!-- Singer dialog -->
<dialog id="singer-dialog">
  <form method="dialog">
    <button type="button" class="dialog-close" onclick="document.getElementById('singer-dialog').close('cancel')">✕</button>
    <h2 id="singer-title">Đặt bài</h2>
    <label for="singer-input">Tên người hát</label>
    <input id="singer-input" type="text" maxlength="24" placeholder="Không bắt buộc" inputmode="none">
    <menu>
      <button type="button" class="btn-cancel" onclick="document.getElementById('singer-dialog').close('cancel')">Huỷ</button>
      <button value="ok" class="btn-ok">Đặt bài</button>
    </menu>
  </form>
</dialog>

<script src="kiosk.js" type="module"></script>
</body>
</html>
