# /etc/wireplumber/wireplumber.conf.d/51-karaoke-usb.conf   (WirePlumber 0.5 / Debian 13)
#
# CẢNH BÁO: WirePlumber 0.4 (Debian 12) dùng cú pháp Lua hoàn toàn khác
# (/etc/wireplumber/main.lua.d/). Đừng chép nhầm giữa hai bản.
#
# Khớp theo tên thật của thiết bị — lấy bằng:
#   pw-dump | jq -r '.[] | .info.props."node.name" // empty' | sort -u
# Tuyệt đối không khớp theo chỉ số card: thứ tự đổi sau mỗi lần reboot.

monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 256
        api.alsa.periods     = 2
        api.alsa.headroom    = 256
        node.pause-on-idle   = false
        # BẮT BUỘC. Mặc định WirePlumber treo node sau 5s im lặng; khi người hát
        # cất tiếng, thiết bị phải wake up -> nghe "tách" và mất đầu câu. Đây là
        # lỗi hay gặp nhất khi làm karaoke trên PipeWire.
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    # Vô hiệu hoá hẳn audio HDMI để nhạc không bao giờ ra loa TV do chọn nhầm.
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
