# /etc/wireplumber/wireplumber.conf.d/50-volume-default.conf   (WirePlumber 0.5.8 / Debian 13)
#
# Debian đặt device.routes.default-sink-volume mặc định = 0.064 (cubic) = 40%
# tuyến "safe listening". WirePlumber không lưu state qua reboot trên máy này
# (~/.local/state/wireplumber/ luôn rỗng) nên mỗi lần route được áp lại, sink
# tụt về 40% — wpctl set-volume 1.0 chỉ có tác dụng vài giây rồi bị route
# apply đè lại. Set thẳng default = 1.0 để không phải chạy đua với WP nữa.
#
# device.restore-routes = false: không tự chọn lại port đã lưu lúc khởi động,
# tránh WP đè ALSA Headphone/Front về giá trị cũ khi asound.state chưa kịp áp.
wireplumber.settings = {
  device.restore-routes = false
  device.routes.default-sink-volume = 1.0
}
