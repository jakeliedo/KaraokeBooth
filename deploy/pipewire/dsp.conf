# /etc/karaoke/dsp.conf — chuỗi DSP của KaraokeBooth.
#
# Chạy bằng MỘT TIẾN TRÌNH RIÊNG:  pipewire -c /etc/karaoke/dsp.conf
# Không nạp vào context.modules của daemon: nếu một plugin crash hoặc gặp denormal
# thì cả PipeWire server chết và mất toàn bộ tiếng. Chạy riêng thì systemd restart
# trong 1-2 giây, server và các app khác vẫn sống.
#
# Giai đoạn 2 — Mức A: chỉ xử lý NHẠC. Mic đi thẳng trong MG10XU (xem docs/WIRING.md).
# Khối mic ở cuối file để sẵn cho Mức B, đang bị vô hiệu hoá.

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { nice.level = -11  rt.prio = 88  rt.time.soft = 200000  rt.time.hard = 200000 } }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # --- Bus nhạc: mpv và (Giai đoạn 3) fluidsynth phát vào đây ------------
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "Karaoke Music"
          media.name       = "Karaoke Music"
          filter.graph = {
              nodes = [
                  # EQ 4 băng bằng node builtin: không phụ thuộc plugin ngoài,
                  # CPU gần bằng 0, không có latency ẩn. Python chỉnh runtime qua
                  # Props.params với tên "<label>:<port>".
                  { type = builtin  label = bq_lowshelf   name = eq_low
                    control = { "Freq" = 120   "Q" = 0.7  "Gain" = 0.0 } }
                  { type = builtin  label = bq_peaking    name = eq_mid1
                    control = { "Freq" = 500   "Q" = 1.0  "Gain" = 0.0 } }
                  { type = builtin  label = bq_peaking    name = eq_mid2
                    control = { "Freq" = 2500  "Q" = 1.0  "Gain" = 0.0 } }
                  { type = builtin  label = bq_highshelf  name = eq_high
                    control = { "Freq" = 8000  "Q" = 0.7  "Gain" = 0.0 } }
              ]
              links = [
                  { output = "eq_low:Out"   input = "eq_mid1:In" }
                  { output = "eq_mid1:Out"  input = "eq_mid2:In" }
                  { output = "eq_mid2:Out"  input = "eq_high:In" }
              ]
              inputs  = [ "eq_low:In"   "eq_low:In"  ]
              outputs = [ "eq_high:Out" "eq_high:Out" ]
          }
          capture.props = {
              node.name    = "karaoke_music"
              media.class  = Audio/Sink
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name    = "karaoke_music_out"
              node.passive = true
              audio.position = [ FL FR ]
              # Trỏ tới node ra thật. Lấy tên bằng `pw-dump`, ĐỪNG đoán.
              # target.object = "alsa_output.usb-YAMAHA_..._MG-XU-00.analog-stereo"
          }
      }
    }

    # --- Mức B: chuỗi DSP cho mic -----------------------------------------
    # Chỉ bật khi mic thực sự đi qua máy (audio interface riêng). Với MG10XU đơn
    # thuần thì bật khối này sẽ tạo vòng lặp phản hồi — xem docs/WIRING.md.
    #
    # mic1: bq_highpass x2 -> Gate -> De-esser -> EQ4 -> Comp -> NotchBank(8) -> gain
    # mic2: giống hệt
    # sum -> dry + send_reverb(Dragonfly Hall) + send_delay(Calf Vintage Delay)
    #
    # LƯU Ý: filter-graph cấm chu trình, nên echo có feedback PHẢI dùng plugin có
    # feedback nội bộ; node `delay` builtin chỉ là delay line thuần, không làm được.
]
