# /etc/pipewire/pipewire.conf.d/10-karaoke-clock.conf
#
# Bắt đầu ở quantum 256 (an toàn). Chỉ giảm xuống 128 sau khi đã chạy 2 giờ đầy
# tải với `pw-top` cột ERR = 0. Thà 18ms mà không bao giờ xrun, còn hơn 11ms mà
# mỗi tối kêu "tách" vài lần — với máy chạy trong quán, ổn định thắng độ trễ.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 512
}
