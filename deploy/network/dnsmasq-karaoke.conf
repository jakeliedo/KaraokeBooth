# /etc/dnsmasq.d/karaoke.conf
interface=wlan0
bind-interfaces
except-interface=lo

dhcp-range=192.168.50.50,192.168.50.200,255.255.255.0,12h
dhcp-option=3,192.168.50.1                 # gateway
dhcp-option=6,192.168.50.1                 # DNS = chính máy này
dhcp-option=114,"http://192.168.50.1/"     # RFC 8910 captive-portal URI

# DNS wildcard: mọi tên miền về máy này — nền tảng của captive portal.
address=/#/192.168.50.1

# Tên dễ nhớ. KHÔNG dùng mDNS/.local làm đường chính: Android phân giải .local
# không đáng tin. Ở đây máy CHÍNH LÀ DNS server của mạng nên cách này chắc chắn.
address=/karaoke.box/192.168.50.1
address=/chonbai/192.168.50.1

no-resolv
log-dhcp
