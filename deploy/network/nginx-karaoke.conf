# /etc/nginx/sites-available/karaoke
#
# nginx phục vụ PWA tĩnh và reverse proxy API/WebSocket sang karaoke-core
# (chỉ nghe 127.0.0.1:8080, không phơi trực tiếp ra mạng khách).

server {
    listen 80 default_server;
    server_name _;

    root /opt/karaoke/web;
    index index.html;
    charset utf-8;

    # --- Captive portal ---------------------------------------------------
    # Trả 302 (KHÔNG trả 204) để điện thoại hiểu là "chưa có Internet" và bật
    # màn hình đăng nhập mạng.
    location = /generate_204        { return 302 http://192.168.50.1/portal.html; }
    location = /gen_204             { return 302 http://192.168.50.1/portal.html; }
    location = /hotspot-detect.html { return 302 http://192.168.50.1/portal.html; }
    location = /connecttest.txt     { return 302 http://192.168.50.1/portal.html; }
    location = /ncsi.txt            { return 302 http://192.168.50.1/portal.html; }
    location ^~ /library/test/      { return 302 http://192.168.50.1/portal.html; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;                    # /api/ws mở rất lâu
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
