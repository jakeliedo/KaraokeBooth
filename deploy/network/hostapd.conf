# /etc/hostapd/hostapd.conf
# SSID và mật khẩu được sinh ngẫu nhiên lúc first-boot và ghi đè hai dòng tương
# ứng ở đây (xem provision.sh / karaoke-firstboot).

interface=wlan0
driver=nl80211
ssid=KARAOKE-0000
country_code=VN
ieee80211d=1

# 5GHz kênh 36-48 là non-DFS: không phải chờ dò radar, và trong quán thì băng
# 2.4GHz thường kẹt cứng (WiFi hàng xóm, lò vi sóng, và chính USB3 của máy này
# phát nhiễu 2.4GHz). Điện thoại từ 2015 trở lại đây đều hỗ trợ 5GHz.
# Đổi về 2.4GHz (hw_mode=g, channel=1/6/11) nếu phòng hát cách máy qua tường dày.
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=0
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=doi-mat-khau-nay

macaddr_acl=0
ignore_broadcast_ssid=0
ap_isolate=1          # khách không thấy nhau: an toàn hơn và giảm broadcast
max_num_sta=24
