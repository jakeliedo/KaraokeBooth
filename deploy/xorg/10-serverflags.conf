# Khoá mọi lối thoát khỏi kiosk.
Section "ServerFlags"
    Option "DontVTSwitch" "true"     # chặn Ctrl+Alt+F1..F6
    Option "DontZap"      "true"     # chặn Ctrl+Alt+Backspace
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
EndSection
