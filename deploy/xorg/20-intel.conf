# Dùng driver `modesetting`, KHÔNG dùng xserver-xorg-video-intel — driver cũ đã bị
# bỏ rơi và gây lỗi trên GPU Intel đời mới.
Section "Device"
    Identifier  "Intel Graphics"
    Driver      "modesetting"
    Option      "AccelMethod" "glamor"
    Option      "DRI"         "3"
    # TearFree có ở xserver 21.1+. Kiểm chứng: xrandr --verbose | grep -i tear
    # Nếu không có, mpv với --vo=gpu --gpu-context=x11egl vẫn xử lý tearing tốt.
    Option      "TearFree"    "true"
EndSection
